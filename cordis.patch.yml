# dsh-git-heatmap bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (the /git-heat/* routes plus the managed git subprocess),
# and the `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: ui-git-heatmap
      name: '@senmoxiu/dsh-git-heatmap'
